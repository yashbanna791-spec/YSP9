<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>YSP9 Admin Panel</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>


<!-- =============================== -->
<!-- ADMIN LOGIN -->
<!-- =============================== -->

<div id="loginBox" class="hero">

<h1>🔐 YSP9 Admin Login</h1>

<p>Admin Panel access ke liye login karo</p>

<input
type="email"
id="loginEmail"
placeholder="Admin Email"
>

<br><br>

<input
type="password"
id="loginPassword"
placeholder="Password"
>

<br><br>

<button id="loginBtn">
🔐 Login
</button>

<p id="loginStatus"></p>

</div>


<!-- =============================== -->
<!-- ADMIN DASHBOARD -->
<!-- =============================== -->

<div id="adminDashboard"
style="display:none;">


<header class="header">

<div class="logo">
🔐 YSP9 Admin
</div>

<nav>

<a href="index.html">Home</a>

<a href="notes.html">Notes</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<button id="logoutBtn">
🚪 Logout
</button>

</nav>

</header>


<!-- =============================== -->
<!-- UPLOAD PDF -->
<!-- =============================== -->

<section class="hero">

<h1>Admin Dashboard</h1>

<p>Upload and Manage Notes</p>


<input
type="text"
id="subject"
placeholder="Subject (Physics, Chemistry, Biology...)"
>

<br><br>


<select id="category">

<option value="notes">
📚 Notes
</option>

<option value="important">
⭐ Important Questions
</option>

</select>

<br><br>


<input
type="text"
id="chapter"
placeholder="Chapter Name"
>

<br><br>


<input
type="file"
id="pdfFile"
accept="application/pdf,.pdf"
>

<br><br>


<button id="uploadBtn">
📤 Upload PDF
</button>


<p id="status"></p>

</section>


<!-- =============================== -->
<!-- CONTACT MESSAGES -->
<!-- =============================== -->

<section class="subjects">

<h2>📩 Contact Messages</h2>

<div id="contactMessages">

<p style="text-align:center;">
⏳ Messages load ho rahe hain...
</p>

</div>

</section>


<!-- =============================== -->
<!-- MANAGE PDFs -->
<!-- =============================== -->

<section class="subjects">

<h2>🗂️ Manage Uploaded PDFs</h2>

<div id="uploadedFiles">

<p style="text-align:center;">
⏳ Uploaded PDFs load ho rahe hain...
</p>

</div>

</section>


<footer>

© 2026 YSP9 Admin

</footer>

</div>


<script>


// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
"https://cwelkiqvnvyjgtryztgv.supabase.co";


const SUPABASE_KEY =
"sb_publishable__wxc6yDeapVr77Mz8tE_DA_4Z0dSpEa";


const adminSupabase =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// ===============================
// ELEMENTS
// ===============================

const loginBox =
document.getElementById("loginBox");

const adminDashboard =
document.getElementById("adminDashboard");

const loginStatus =
document.getElementById("loginStatus");


// ===============================
// LOGIN
// ===============================

document
.getElementById("loginBtn")
.addEventListener(
"click",
adminLogin
);


async function adminLogin() {

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;


if (!email || !password) {

loginStatus.innerText =
"⚠️ Email aur password dono bharo.";

return;

}


loginStatus.innerText =
"⏳ Login ho raha hai...";


const {
data,
error
} =
await adminSupabase.auth.signInWithPassword({

email: email,

password: password

});


if (error) {

console.error(error);

loginStatus.innerText =
"❌ Login failed: " +
error.message;

return;

}


if (data.session) {

loginStatus.innerText =
"✅ Login successful!";

showDashboard();

}

}


// ===============================
// SHOW DASHBOARD
// ===============================

function showDashboard() {

loginBox.style.display =
"none";

adminDashboard.style.display =
"block";

loadUploadedFiles();

loadContactMessages();

}


// ===============================
// LOGOUT
// ===============================

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function () {

await adminSupabase.auth.signOut();

adminDashboard.style.display =
"none";

loginBox.style.display =
"block";

document
.getElementById("loginPassword")
.value = "";

loginStatus.innerText =
"";

});


// ===============================
// CHECK EXISTING SESSION
// ===============================

async function checkSession() {

const {
data
} =
await adminSupabase.auth.getSession();


if (data.session) {

showDashboard();

}

}


checkSession();


// ===============================
// UPLOAD PDF
// ===============================

document
.getElementById("uploadBtn")
.addEventListener(
"click",
async function () {


const button =
document.getElementById("uploadBtn");

const status =
document.getElementById("status");

const subject =
document
.getElementById("subject")
.value
.trim();

const category =
document
.getElementById("category")
.value;

const chapter =
document
.getElementById("chapter")
.value
.trim();

const file =
document
.getElementById("pdfFile")
.files[0];


if (
!subject ||
!category ||
!chapter ||
!file
) {

status.innerText =
"⚠️ Subject, Category, Chapter aur PDF select karo.";

return;

}


if (
file.type !== "application/pdf"
) {

status.innerText =
"❌ Sirf PDF file upload karo.";

return;

}


button.disabled = true;

status.innerText =
"⏳ PDF upload ho rahi hai...";


const safeSubject =
subject
.toLowerCase()
.replace(
/[^a-z0-9]+/g,
"-"
);


const safeChapter =
chapter
.toLowerCase()
.replace(
/[^a-z0-9]+/g,
"-"
);


const fileName =
Date.now() +
"-" +
file.name.replace(
/\s+/g,
"-"
);


const filePath =
category +
"/" +
safeSubject +
"/" +
safeChapter +
"/" +
fileName;


// STORAGE

const {
error: uploadError
} =
await adminSupabase
.storage
.from("pdfs")
.upload(
filePath,
file,
{
contentType:
"application/pdf",

upsert:
false
}
);


if (uploadError) {

console.error(uploadError);

status.innerText =
"❌ Upload failed: " +
uploadError.message;

button.disabled = false;

return;

}


// PUBLIC URL

const {
data: urlData
} =
adminSupabase
.storage
.from("pdfs")
.getPublicUrl(
filePath
);


const publicUrl =
urlData.publicUrl;


// DATABASE

const {
error: databaseError
} =
await adminSupabase
.from("notes")
.insert({

subject:
subject,

category:
category,

chapter:
chapter,

pdf_path:
publicUrl

});


if (databaseError) {

console.error(databaseError);

status.innerText =
"⚠️ PDF upload ho gayi, lekin database me save nahi hui: " +
databaseError.message;

button.disabled = false;

return;

}


// SUCCESS

status.innerHTML =

"✅ PDF successfully upload ho gayi!<br><br>" +

"<b>Subject:</b> " +
subject +

"<br>" +

"<b>Category:</b> " +
category +

"<br>" +

"<b>Chapter:</b> " +
chapter +

"<br><br>" +

"<a href='" +
publicUrl +
"' target='_blank'>" +

"📄 Open PDF" +

"</a>";


document
.getElementById("subject")
.value = "";

document
.getElementById("chapter")
.value = "";

document
.getElementById("pdfFile")
.value = "";

button.disabled = false;

loadUploadedFiles();

});


// ===============================
// LOAD PDFs
// ===============================

async function loadUploadedFiles() {

const container =
document.getElementById(
"uploadedFiles"
);


const {
data,
error
} =
await adminSupabase
.from("notes")
.select("*")
.order(
"created_at",
{
ascending: false
}
);


if (error) {

console.error(error);

container.innerHTML =
"<p style='text-align:center;'>❌ Files load nahi hui.</p>";

return;

}


if (!data || data.length === 0) {

container.innerHTML =
"<p style='text-align:center;'>📚 Abhi koi PDF upload nahi hai.</p>";

return;

}


container.innerHTML = "";


data.forEach(note => {

const card =
document.createElement("div");

card.className =
"card";


let icon = "📚";

if (
String(note.category)
.toLowerCase() ===
"important"
) {

icon = "⭐";

}


card.innerHTML = `

<h3>
${icon} ${note.subject}
</h3>

<p>
${note.chapter}
</p>

<p>
Category: ${note.category}
</p>

<a
href="${note.pdf_path}"
target="_blank">

<button>
📄 Open PDF
</button>

</a>

<br><br>

<button
onclick="deletePDF(
'${note.id}',
'${note.pdf_path}'
)">

🗑️ Delete PDF

</button>

`;


container.appendChild(card);

});

}


// ===============================
// DELETE PDF
// ===============================

async function deletePDF(
id,
publicUrl
) {


const confirmDelete =
confirm(
"⚠️ Kya tum ye PDF permanently delete karna chahte ho?"
);


if (!confirmDelete) return;


const status =
document.getElementById(
"status"
);


status.innerText =
"⏳ PDF delete ho rahi hai...";


const marker =
"/storage/v1/object/public/pdfs/";


const position =
publicUrl.indexOf(marker);


if (position === -1) {

status.innerText =
"❌ PDF path identify nahi ho paaya.";

return;

}


const filePath =
decodeURIComponent(

publicUrl.substring(
position + marker.length
)

);


// STORAGE DELETE

const {
error: storageError
} =
await adminSupabase
.storage
.from("pdfs")
.remove([
filePath
]);


if (storageError) {

console.error(storageError);

status.innerText =
"❌ Storage delete failed: " +
storageError.message;

return;

}


// DATABASE DELETE

const {
error: databaseError
} =
await adminSupabase
.from("notes")
.delete()
.eq(
"id",
Number(id)
);


if (databaseError) {

console.error(databaseError);

status.innerText =
"⚠️ Storage se delete ho gayi, lekin database record delete nahi hua.";

return;

}


status.innerText =
"✅ PDF successfully delete ho gayi!";

loadUploadedFiles();

}


// ===============================
// CONTACT MESSAGES
// ===============================

async function loadContactMessages() {

const container =
document.getElementById(
"contactMessages"
);


if (!container) return;


const {
data,
error
} =
await adminSupabase
.from("contact_messages")
.select("*")
.order(
"created_at",
{
ascending: false
}
);


if (error) {

console.error(error);

container.innerHTML =
"<p style='text-align:center;'>❌ Messages load nahi hue.</p>";

return;

}


if (!data || data.length === 0) {

container.innerHTML =
"<p style='text-align:center;'>📭 Abhi koi message nahi hai.</p>";

return;

}


container.innerHTML = "";


data.forEach(message => {

const card =
document.createElement("div");

card.className =
"card";


card.innerHTML = `

<h3>
📩 ${message.name}
</h3>

<p>
📧 <b>Email:</b>
${message.email}
</p>

<p>
💬 <b>Message:</b><br>
${message.message}
</p>

<p>
🕒
${new Date(
message.created_at
).toLocaleString()}
</p>

<button
onclick="deleteContactMessage(
'${message.id}'
)">

🗑️ Delete Message

</button>

`;


container.appendChild(card);

});

}


// ===============================
// DELETE CONTACT MESSAGE
// ===============================

async function deleteContactMessage(id) {

const confirmDelete =
confirm(
"⚠️ Kya tum ye message permanently delete karna chahte ho?"
);


if (!confirmDelete) return;


const {
error
} =
await adminSupabase
.from("contact_messages")
.delete()
.eq(
"id",
id
);


if (error) {

console.error(error);

alert(
"❌ Message delete nahi hua: " +
error.message
);

return;

}


alert(
"✅ Message delete ho gaya!"
);


loadContactMessages();

}


</script>

</body>

  </html>
