<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>YSP9 Admin Panel</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<header class="header">

<div class="logo">
🔐 YSP9 Admin
</div>

<nav>

<a href="index.html">Home</a>
<a href="notes.html">Notes</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>

</nav>

</header>


<section class="hero">

<h1>Admin Dashboard</h1>

<p>Upload and Manage Notes</p>


<input
type="text"
id="subject"
placeholder="Subject (Physics, Chemistry, Biology...)"
>

<br><br>


<select id="category">

<option value="notes">
📚 Notes
</option>

<option value="important">
⭐ Important Questions
</option>

</select>

<br><br>


<input
type="text"
id="chapter"
placeholder="Chapter Name"
>

<br><br>


<input
type="file"
id="pdfFile"
accept="application/pdf,.pdf"
>

<br><br>


<button id="uploadBtn">
Upload PDF
</button>


<p id="status"></p>

</section>



<!-- =============================== -->
<!-- MANAGE UPLOADED PDFs -->
<!-- =============================== -->

<section class="subjects">

<h2>🗂️ Manage Uploaded PDFs</h2>

<div id="uploadedFiles">

<p style="text-align:center;">
⏳ Uploaded PDFs load ho rahe hain...
</p>

</div>

</section>



<footer>

© 2026 YSP9 Admin

</footer>



<script>

const SUPABASE_URL =
"https://cwelkiqvnvyjgtryztgv.supabase.co";


const SUPABASE_KEY =
"sb_publishable__wxc6yDeapVr77Mz8tE_DA_4Z0dSpEa";


const adminSupabase =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// ===============================
// UPLOAD PDF
// ===============================

document
.getElementById("uploadBtn")
.addEventListener(
"click",
async function () {

const button =
document.getElementById("uploadBtn");

const status =
document.getElementById("status");

const subject =
document
.getElementById("subject")
.value
.trim();

const category =
document
.getElementById("category")
.value;

const chapter =
document
.getElementById("chapter")
.value
.trim();

const file =
document
.getElementById("pdfFile")
.files[0];


if (!subject ||
!category ||
!chapter ||
!file) {

status.innerText =
"⚠️ Subject, Category, Chapter aur PDF select karo.";

return;

}


if (file.type !== "application/pdf") {

status.innerText =
"❌ Sirf PDF file upload karo.";

return;

}


button.disabled = true;

status.innerText =
"⏳ PDF upload ho rahi hai...";


const safeSubject =
subject
.toLowerCase()
.replace(/[^a-z0-9]+/g, "-");


const safeCategory =
category
.toLowerCase();


const safeChapter =
chapter
.toLowerCase()
.replace(/[^a-z0-9]+/g, "-");


const fileName =
Date.now() +
"-" +
file.name.replace(/\s+/g, "-");


const filePath =
safeCategory +
"/" +
safeSubject +
"/" +
safeChapter +
"/" +
fileName;



// Upload PDF

const { error: uploadError } =
await adminSupabase
.storage
.from("pdfs")
.upload(
filePath,
file,
{
contentType:
"application/pdf",

upsert:
false
}
);


if (uploadError) {

console.error(uploadError);

status.innerText =
"❌ Upload failed: " +
uploadError.message;

button.disabled = false;

return;

}



// Public URL

const { data: urlData } =
adminSupabase
.storage
.from("pdfs")
.getPublicUrl(filePath);


const publicUrl =
urlData.publicUrl;



// Database

const { error: databaseError } =
await adminSupabase
.from("notes")
.insert({

subject:
subject,

category:
category,

chapter:
chapter,

pdf_path:
publicUrl

});


if (databaseError) {

console.error(databaseError);

status.innerText =
"⚠️ PDF upload ho gayi, lekin database me save nahi hui: " +
databaseError.message;

button.disabled = false;

return;

}


status.innerHTML =
"✅ PDF successfully upload ho gayi!<br><br>" +

"<b>Subject:</b> " +
subject +

"<br><b>Category:</b> " +
category +

"<br><b>Chapter:</b> " +
chapter +

"<br><br>" +

"<a href='" +
publicUrl +
"' target='_blank'>" +

"📄 Open PDF" +

"</a>";


button.disabled = false;


// List refresh

loadUploadedFiles();

});



// ===============================
// LOAD UPLOADED PDFs
// ===============================

async function loadUploadedFiles() {

const container =
document.getElementById(
"uploadedFiles"
);


const { data, error } =
await adminSupabase
.from("notes")
.select("*")
.order("created_at", {
ascending: false
});


if (error) {

console.error(error);

container.innerHTML =
"<p style='text-align:center;'>❌ Files load nahi hui.</p>";

return;

}


if (!data ||
data.length === 0) {

container.innerHTML =
"<p style='text-align:center;'>📚 Abhi koi PDF upload nahi hai.</p>";

return;

}


container.innerHTML = "";


data.forEach(note => {

const card =
document.createElement("div");

card.className =
"card";


let icon =
"📚";


if (
String(note.category)
.toLowerCase()
=== "important"
) {

icon = "⭐";

}


card.innerHTML = `

<h3>
${icon} ${note.subject}
</h3>

<p>
${note.chapter}
</p>

<p>
Category: ${note.category}
</p>

<a
href="${note.pdf_path}"
target="_blank">

<button>
📄 Open PDF
</button>

</a>

<br><br>

<button
onclick="deletePDF('${note.id}', '${note.pdf_path}')">

🗑️ Delete PDF

</button>

`;


container.appendChild(card);

});

}



// ===============================
// DELETE PDF
// ===============================

async function deletePDF(id, publicUrl) {

  const confirmDelete = confirm(
    "⚠️ Kya tum ye PDF permanently delete karna chahte ho?"
  );

  if (!confirmDelete) {
    return;
  }

  const status = document.getElementById("status");

  status.innerText = "⏳ PDF delete ho rahi hai...";


  // ===============================
  // FILE PATH FIND
  // ===============================

  const marker = "/storage/v1/object/public/pdfs/";

  const position = publicUrl.indexOf(marker);

  if (position === -1) {

    status.innerText =
      "❌ PDF path identify nahi ho paaya.";

    return;
  }


  const filePath = decodeURIComponent(
    publicUrl.substring(
      position + marker.length
    )
  );


  // ===============================
  // DELETE FROM STORAGE
  // ===============================

  const { error: storageError } =
    await adminSupabase
      .storage
      .from("pdfs")
      .remove([filePath]);


  if (storageError) {

    console.error(storageError);

    status.innerText =
      "❌ Storage delete failed: " +
      storageError.message;

    return;
  }


  // ===============================
  // DELETE DATABASE RECORD
  // ===============================

  const { error: databaseError } =
    await adminSupabase
      .from("notes")
      .delete()
      .eq("id", Number(id));


  if (databaseError) {

    console.error(databaseError);

    status.innerText =
      "⚠️ PDF Storage se delete ho gayi, lekin database record delete nahi hua: " +
      databaseError.message;

    return;
  }


  // ===============================
  // SUCCESS
  // ===============================

  status.innerText =
    "✅ PDF successfully delete ho gayi!";


  // Refresh list
  loadUploadedFiles();

}

const confirmDelete =
confirm(
"⚠️ Kya tum ye PDF permanently delete karna chahte ho?"
);


if (!confirmDelete) {

return;

}


const status =
document.getElementById("status");


status.innerText =
"⏳ PDF delete ho rahi hai...";



// File path URL se nikalo

const marker =
"/storage/v1/object/public/pdfs/";


const position =
publicUrl.indexOf(marker);


if (position === -1) {

status.innerText =
"❌ PDF path identify nahi ho paaya.";

return;

}


const filePath =
decodeURIComponent(
publicUrl.substring(
position + marker.length
)
);



// Storage se delete

const { error: storageError } =
await adminSupabase
.storage
.from("pdfs")
.remove([
filePath
]);


if (storageError) {

console.error(storageError);

status.innerText =
"❌ Storage delete failed: " +
storageError.message;

return;

}



// Database se delete

const { error: databaseError } =
await adminSupabase
.from("notes")
.delete()
.eq("id", id);


if (databaseError) {

console.error(databaseError);

status.innerText =
"⚠️ PDF Storage se delete ho gayi, lekin database record delete nahi hua: " +
databaseError.message;

return;

}


status.innerText =
"✅ PDF successfully delete ho gayi!";


// List refresh

loadUploadedFiles();

}



// ===============================
// START
// ===============================

loadUploadedFiles();

</script>


</body>

</html>
