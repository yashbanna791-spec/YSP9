<script>

const SUPABASE_URL =
"https://cwelkiqvnvyjgtryztgv.supabase.co";

const SUPABASE_KEY =
"sb_publishable__wxc6yDeapVr77Mz8tE_DA_4Z0dSpEa";

const chemistrySupabase =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadChemistryQuestions() {

  const container =
    document.getElementById(
      "chemistryQuestions"
    );


const { data, error } =
  await chemistrySupabase
    .from("notes")
    .select("*")
    .ilike("subject", "Chemistry")
    .eq("category", "important")
    .order("created_at", {
      ascending: false
    });  


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p style='text-align:center;'>❌ Questions load nahi ho paaye.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p style='text-align:center;'>📚 Chemistry Important Questions abhi available nahi hain.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(note => {

    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `
      <h2>⭐ ${note.chapter}</h2>

      <p>🧪 Class 12 Chemistry</p>

      <a href="${note.pdf_path}" target="_blank">
        <button>📄 Open PDF</button>
      </a>
    `;


    container.appendChild(card);

  });

}


loadChemistryQuestions();

</script>

</body>
