<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://cwelkiqvnvyjgtryztgv.supabase.co";

const SUPABASE_KEY =
"sb_publishable__wxc6yDeapVr77Mz8tE_DA_4Z0dSpEa";

const physicsSupabase =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function loadPhysicsNotes() {

  const container =
    document.getElementById("physicsNotes");

  const { data, error } =
    await physicsSupabase
      .from("notes")
      .select("*")
      .ilike("subject", "physics")
      .order("created_at", { ascending: true });


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p style='text-align:center;'>❌ Notes load nahi ho paaye.</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p style='text-align:center;'>📚 Abhi Physics notes available nahi hain.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(note => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h2>📘 ${note.chapter}</h2>

      <p>Class 12 Physics Notes</p>

      <a href="${note.pdf_path}" target="_blank">
        <button>Open PDF</button>
      </a>
    `;

    container.appendChild(card);

  });

}


loadPhysicsNotes();

</script>

</body>
